name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Builds the packages with a read-only token, no stored git credentials and no cache: npm ci runs the dependencies'
  # install scripts here, and none of them can reach a token that writes.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci --prefix editors/vscode
      - run: npm run validate
      - run: mkdir -p release
      - run: npm pack --pack-destination release
      - run: cp editors/vscode/*.vsix release/
      - run: cd release && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: release/
          if-no-files-found: error

  # Publishes what build made: the only job that can write, and it runs none of the repository's code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: release
          path: release
      - name: Check the packages against their checksums
        run: cd release && sha256sum --check SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --verify-tag
